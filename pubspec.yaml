name: easysend
description: "Simple file transfer between devices over a local network"
publish_to: 'none'

# The build number lives in two places that must stay in sync: `version:` here
# and progVersion / buildNumber in lib/globals.dart.
version: 0.4.260814+107

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Paths and platform directories
  path: ^1.9.0
  path_provider: ^2.1.5
  # Device model / host name for the default device name
  device_info_plus: ^11.5.0
  # Stable device id derived per platform
  uuid: ^4.5.1
  # ANDROID_ID: survives reinstall, unlike the app's private storage
  android_id: ^0.4.0
  # Desktop window sizing (portrait layout everywhere)
  window_manager: ^0.4.3
  # Picking files and folders to send
  file_picker: ^8.3.7
  # Used for its incremental CRC32 only
  archive: ^4.0.7
  # Strong streamed source fingerprint before destructive Move cleanup
  crypto: ^3.0.7
  # Android runtime permissions: storage and notifications
  permission_handler: ^12.0.1
  # Keeps the screen awake while a transfer runs
  wakelock_plus: ^1.2.10
  # Accept/decline prompt and finish notice when the app is not on screen
  flutter_local_notifications: ^19.4.2
  # "Share with EasySend" from any Android app.
  # Pinned: 1.9.0 uses a kotlin {} block without applying the Kotlin plugin and
  # fails to evaluate ("Could not find method kotlin()"). Same API here.
  receive_sharing_intent: 1.8.1
  desktop_drop: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/locales.json
    - assets/colors.json
    # Shipped in the bundle so the Linux runner can set the window icon from it
    - assets/icon2.png

flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 21
  # icon.png is the master: a cream device and a page leaving it, on a solid
  # blue ground, drawn as geometry by tools/make_icon.py. icon_small.png is the
  # same square, for the launchers that mask a plain icon themselves; icon_fg.png
  # is the mark alone on nothing, already centred and scaled to sit inside the
  # round mask, so no inset is added on top of it. The background below is the
  # same blue the square is painted with.
  image_path: "assets/icon_small.png"
  adaptive_icon_background: "#0138A3"
  adaptive_icon_foreground: "assets/icon_fg.png"
  adaptive_icon_foreground_inset: 0
